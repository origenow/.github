<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="Etapas do trabalho: diagnóstico, cadastro, precificação, mídia e análise" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Etapas do trabalho: diagnóstico, cadastro, precificação, mídia e análise</title>
<rect width="1200" height="270" rx="18" fill="#F3EEFC"/>
<line x1="130" y1="84" x2="1070" y2="84" stroke="#B794F6" stroke-width="8" stroke-linecap="round"/>
<circle cx="130" cy="84" r="30" fill="#2A1259" stroke="#F3EEFC" stroke-width="6"/>
<text x="130" y="93" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">1</text>
<text x="130" y="156" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#2A1259">Diagnóstico</text>
<text x="130" y="188" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#5E4B8B">Análise da conta, do catálogo</text>
<text x="130" y="212" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#5E4B8B">e da concorrência</text>
<circle cx="365" cy="84" r="30" fill="#2A1259" stroke="#F3EEFC" stroke-width="6"/>
<text x="365" y="93" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">2</text>
<text x="365" y="156" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#2A1259">Cadastro</text>
<text x="365" y="188" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#5E4B8B">Anúncios e catálogo</text>
<text x="365" y="212" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#5E4B8B">prontos para converter</text>
<circle cx="600" cy="84" r="30" fill="#2A1259" stroke="#F3EEFC" stroke-width="6"/>
<text x="600" y="93" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">3</text>
<text x="600" y="156" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#2A1259">Precificação</text>
<text x="600" y="188" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#5E4B8B">Margem, taxas e</text>
<text x="600" y="212" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#5E4B8B">competitividade por canal</text>
<circle cx="835" cy="84" r="30" fill="#2A1259" stroke="#F3EEFC" stroke-width="6"/>
<text x="835" y="93" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">4</text>
<text x="835" y="156" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#2A1259">Mídia</text>
<text x="835" y="188" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#5E4B8B">Campanhas e ads</text>
<text x="835" y="212" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#5E4B8B">em cada marketplace</text>
<circle cx="1070" cy="84" r="30" fill="#2A1259" stroke="#F3EEFC" stroke-width="6"/>
<text x="1070" y="93" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">5</text>
<text x="1070" y="156" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#2A1259">Análise</text>
<text x="1070" y="188" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#5E4B8B">Relatórios e ajustes</text>
<text x="1070" y="212" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#5E4B8B">de forma contínua</text>
